name: Reader diagnostics

on:
  push:
    paths:
      - "src/worker.mjs"
      - "wrangler.jsonc"
      - "test/**"
      - ".github/workflows/reader-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run reader tests
        run: node --test test/worker.test.mjs
      - name: Check live viewer and PDF delivery
        shell: bash
        run: |
          set -u
          ASSET="https://assets.sacrumflorilegium.com/pdfs/viva-el-rey.pdf"
          READER="https://reader.sacrumflorilegium.com/pdfs/viva-el-rey.pdf"
          VIEWER="https://reader.sacrumflorilegium.com/web/viewer.html?file=https%3A%2F%2Fassets.sacrumflorilegium.com%2Fpdfs%2Fviva-el-rey.pdf"
          for item in asset reader; do
            if [ "$item" = "asset" ]; then url="$ASSET"; else url="$READER"; fi
            echo "::group::$item: HEAD"
            curl --max-time 25 -sSI "$url" | grep -Ei '^(HTTP/|content-type:|content-length:|content-range:|accept-ranges:|etag:|location:|access-control-allow-origin:|cf-ray:)'
            echo "::endgroup::"
            echo "::group::$item: range 0-1023"
            curl --max-time 25 -sS -D "/tmp/$item-range.headers" -H 'Range: bytes=0-1023' -o "/tmp/$item-range.body" "$url" || true
            cat "/tmp/$item-range.headers" | grep -Ei '^(HTTP/|content-type:|content-length:|content-range:|accept-ranges:|etag:|location:|access-control-allow-origin:|cf-ray:)' || true
            echo "bytes received: $(wc -c < "/tmp/$item-range.body")"
            echo "first bytes: $(od -An -tx1 -N16 "/tmp/$item-range.body")"
            echo "::endgroup::"
          done
          echo "::group::Viewer legacy link redirect"
          curl --max-time 25 -sSI "$VIEWER" | grep -Ei '^(HTTP/|content-type:|content-length:|location:|cf-ray:)' || true
          echo "::endgroup::"
          echo "::group::PDF file integrity"
          curl --max-time 60 -sSL -o /tmp/viva-el-rey.pdf "$ASSET" || true
          file /tmp/viva-el-rey.pdf || true
          pdfinfo /tmp/viva-el-rey.pdf | head -24 || true
          echo "::endgroup::"

      - name: Inspect embedded image formats in the PDF
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl --max-time 60 -fsSL -o /tmp/viva-el-rey.pdf "https://assets.sacrumflorilegium.com/pdfs/viva-el-rey.pdf"
          echo "=== PDF metadata ==="
          pdfinfo /tmp/viva-el-rey.pdf | head -35
          echo "=== First 80 embedded images ==="
          pdfimages -f 1 -l 8 -list /tmp/viva-el-rey.pdf | head -85
          echo "=== Image codec totals ==="
          pdfimages -list /tmp/viva-el-rey.pdf | awk 'NR>2 { codecs[$9]++; maxwidth=($4>maxwidth?$4:maxwidth); maxheight=($5>maxheight?$5:maxheight) } END {for(k in codecs) print k,codecs[k];print "MAX_DIMENSIONS",maxwidth,maxheight}'
          echo "=== Can Poppler rasterize page one? ==="
          pdftoppm -f 1 -singlefile -scale-to 500 -png /tmp/viva-el-rey.pdf /tmp/viva-el-rey-firstpage
          file /tmp/viva-el-rey-firstpage.png

      - name: Inspect PDF.js in a real browser
        shell: bash
        run: |
          set -e
          npm install --prefix /tmp/reader-browser playwright
          /tmp/reader-browser/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from '/tmp/reader-browser/node_modules/playwright/index.mjs';
          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          for (const file of [
            "https://assets.sacrumflorilegium.com/pdfs/viva-el-rey.pdf",
            "https://reader.sacrumflorilegium.com/pdfs/viva-el-rey.pdf",
          ]) {
            const url = "https://reader.sacrumflorilegium.com/web/viewer.html?file=" + encodeURIComponent(file);
            const page = await browser.newPage();
            console.log("=== TEST", file, "===");
            page.on("console", message => { if (message.type() === "error" || message.type() === "warning") console.log("BROWSER-CONSOLE:", message.type(), message.text().slice(0,600)); });
            page.on("pageerror", error => console.log("BROWSER-ERROR:", error.message));
            page.on("requestfailed", request => console.log("FAILED-REQUEST:", request.url().slice(0,220), request.failure()?.errorText));
            page.on("response", response => {
              if (response.url().includes("viva-el-rey") || response.url().includes("/web/viewer"))
                console.log("RESPONSE:", response.status(), response.url().slice(0,230));
            });
            try {
              const nav = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 30000 });
              console.log("NAV:", nav?.status(), page.url());
              await page.waitForTimeout(12000);
              const state = await page.evaluate(() => ({
                url: location.href,
                documentTitle: document.title,
                pages: globalThis.PDFViewerApplication?.pdfDocument?.numPages ?? null,
                loading: globalThis.PDFViewerApplication?.loadingBar?.percent ?? null,
                errorText: document.querySelector("#errorWrapper")?.innerText?.slice(0,1000) ?? null,
                viewerPages: document.querySelectorAll(".page").length,
              }));
              const rendered = await page.evaluate(() => {
                const view=globalThis.PDFViewerApplication?.pdfViewer?.getPageView(0);
                const el=document.querySelector(".page");
                return { state:view?.renderingState,canvas:[...(el?.querySelectorAll("canvas")||[])].map(c=>[c.width,c.height]),loadingIcon:!!el?.querySelector(".loadingIcon") };
              });
              console.log("READER-STATE:", JSON.stringify({...state,...rendered}));
              if (state.pages !== 65 || rendered.state !== 3 || !rendered.canvas.length) process.exitCode = 1;
            } catch (error) { console.log("TEST-ERROR:", error.message); }
            await page.close();
          }
          await browser.close();
          NODE

      - name: Check mobile Safari-like WebKit PDF rendering
        shell: bash
        run: |
          set -e
          /tmp/reader-browser/node_modules/.bin/playwright install --with-deps webkit
          node --input-type=module <<'NODE'
          import { webkit } from '/tmp/reader-browser/node_modules/playwright/index.mjs';
          const browser = await webkit.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
          });
          for (const path of ["/web/viewer.html", "/web/viewer"]) {
            const file = "https://assets.sacrumflorilegium.com/pdfs/viva-el-rey.pdf";
            const url = "https://reader.sacrumflorilegium.com" + path + "?file=" + encodeURIComponent(file);
            const page = await context.newPage();
            console.log("WEBKIT-START:", url);
            page.on("console", msg => { if (msg.type() === "error") console.log("WEBKIT-CONSOLE:", msg.text().slice(0,600)); });
            page.on("pageerror", err => console.log("WEBKIT-ERROR:", err.message));
            page.on("requestfailed", req => console.log("WEBKIT-REQUEST-FAILED:", req.url().slice(0,180), req.failure()?.errorText));
            try {
              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 30000 });
              await page.waitForTimeout(12000);
              const result = await page.evaluate(() => ({
                currentUrl: location.href,
                pages: globalThis.PDFViewerApplication?.pdfDocument?.numPages ?? null,
                errorText: document.querySelector("#errorWrapper")?.innerText?.slice(0,500) ?? null,
                renderedPages: document.querySelectorAll(".page").length,
              }));
              const render = await page.evaluate(() => {
                const app = globalThis.PDFViewerApplication;
                const views = [0,1].map(i => {
                  const v = app?.pdfViewer?.getPageView(i);
                  const el = document.querySelectorAll(".page")[i];
                  const canvases = [...(el?.querySelectorAll("canvas") || [])];
                  return {
                    renderingState: v?.renderingState,
                    visiblePage: !!el && !!el.getBoundingClientRect().height,
                    pageClass: el?.className,
                    hasLoadingIcon: !!el?.querySelector(".loadingIcon"),
                    canvas: canvases.map(c => ({ width:c.width, height:c.height, cssWidth:c.clientWidth, cssHeight:c.clientHeight })),
                    drawLayer: el?.querySelector(".canvasWrapper")?.outerHTML?.slice(0,300),
                  };
                });
                return { views };
              });
              console.log("WEBKIT-STATE:", JSON.stringify({...result, ...render}));
              if (result.pages !== 65 || !render.views.some(v => v.renderingState === 3 && v.canvas.some(c=>c.width>0))) process.exitCode = 1;
            } catch (error) { console.log("WEBKIT-EXCEPTION:", error.message); process.exitCode = 1; }
            await page.close();
          }
          await browser.close();
          NODE
